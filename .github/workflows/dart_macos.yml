name: macos

on:
  push:
    branches: [ "main" ]
    paths:
      - '**/*.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'
      - 'macos/**'
      - 'packages/**'
      - 'distribute_options.yaml'
      - '.github/workflows/dart_macos.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'manual dispatch' }}
  COMMIT_AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Output Commit Information
        run: |
          echo "触发此次action的提交ID: ${{ github.sha }}"
          echo "提交信息: $COMMIT_MESSAGE"
          echo "提交作者: $COMMIT_AUTHOR"
          GITHASH=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "GITHASH=$GITHASH" >> $GITHUB_ENV
          echo "GITHASH (前7位): $GITHASH"
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.38.10'
          
      - run: flutter --version
      - run: flutter pub get
      
      # 安装 CocoaPods 依赖
      - name: Install CocoaPods dependencies
        run: |
          cd macos
          pod install

      - name: Verify bundled FFmpeg framework signatures
        run: |
          for framework in packages/ffmpeg_kit_flutter_new_audio-2.5.2/macos/Frameworks/*.framework; do
            codesign --verify --strict --verbose=2 "$framework"
          done
      
      # 替换distribute_options.yaml中的$GITHASH
      - name: Replace GITHASH in distribute_options.yaml
        run: |
          sed -i '' "s/\$GITHASH/${{ env.GITHASH }}/g" distribute_options.yaml
        shell: bash
        
      # 构建 macOS app
      - name: Build macOS app
        run: |
          dart pub global activate fastforge
          fastforge release --name prod
        
      # 从 pubspec.yaml 提取版本号
      - name: Extract Version from pubspec.yaml
        id: extract_version
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
          echo "VERSION=$version" >> $GITHUB_ENV
        shell: bash
        
      - name: Debug Version
        run: echo "${{ env.VERSION }}"
      
      # 删除该 Release 下所有旧的 macOS 构建文件
      - name: Delete Old macOS Assets from Release
        run: |
          gh release view "${{ env.VERSION }}" --json assets --jq '.assets[].name' | grep -E 'listen1_xuan-.+-macos-.+\.zip$' | while read asset; do
            echo "Deleting old asset: $asset"
            gh release delete-asset "${{ env.VERSION }}" "$asset" --yes || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      
      # 重命名文件以包含 GITHASH
      - name: Rename macOS artifact
        run: |
          mv "dist/${{ env.VERSION }}/listen1_xuan-${{ env.VERSION }}-macos.zip" "dist/${{ env.VERSION }}/listen1_xuan-${{ env.VERSION }}-macos-${GITHASH}.zip"
        shell: bash
          
          # 上传 .app 文件
      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-artifact
          path: dist/${{ env.VERSION }}/listen1_xuan-${{ env.VERSION }}-macos-${{ env.GITHASH }}.zip
          
      # 上传到 Release
      - name: Upload New Asset to Release
        uses: softprops/action-gh-release@v2.3.2
        with:
          tag_name: ${{ env.VERSION }}
          files: dist/${{ env.VERSION }}/listen1_xuan-${{ env.VERSION }}-macos-${{ env.GITHASH }}.zip
          prerelease: ${{ !contains(env.COMMIT_MESSAGE, 'sta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
